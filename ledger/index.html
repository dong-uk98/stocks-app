<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="robots" content="noindex,nofollow">
<title>여유자금 가계부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* 레이아웃: 폰 한 줄 세로 흐름. 잠금·월초 확인은 화면 전체를 덮는 한 장 */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --line:#dfe4dd; --fg:#1d2621; --muted:#66736b;
  --income:#2f6f8f; --fixed:#b5562f; --invest:#5a55a6; --free:#2f7d4f; --warn:#b5562f;
  --track:#e7ebe5; --on-accent:#ffffff;
  --font:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121714; --surface:#1a211d; --line:#2b3530; --fg:#e4ebe6; --muted:#93a19a;
  --income:#6fb0cf; --fixed:#e08a63; --invest:#a09cf0; --free:#6cc28f; --warn:#e08a63;
  --track:#25302a; --on-accent:#0f1612; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.num{font-variant-numeric:tabular-nums}
h1{font-size:1.15rem;margin:0;font-weight:700}
h2{font-size:1rem;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:.82rem}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
:focus-visible{outline:2px solid var(--free);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px}
.btn.primary{background:var(--free);border-color:var(--free);color:var(--on-accent);font-weight:600}
.btn.primary:disabled{opacity:.45}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:6px}
.err{color:var(--warn);font-size:.88rem;min-height:1.3em}

/* 잠금·월초 확인 — 화면 전체 */
.gate{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:420px;margin:0 auto}
.gate .mark{width:52px;height:52px;border-radius:14px;background:var(--free);display:grid;place-items:center}
.gate .mark svg{width:28px;height:28px}
.gate h1{font-size:1.4rem}
.gate form{display:flex;flex-direction:column;gap:10px}
.bio{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-weight:600}
.bio svg{width:22px;height:22px}


/* 본 화면 */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.hero .big{font-size:2.1rem;font-weight:700;color:var(--free);line-height:1.1}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--track)}
.stack span{display:block;height:100%}
.eq{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:baseline;font-size:.92rem}
.eq .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.eq .v{text-align:right}
.eq .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px}
.row:first-child{border-top:0}
.row .bar{width:4px;align-self:stretch;border-radius:2px}
.row .main{flex:1;min-width:0}
.row .name{font-weight:500}
.row .note{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.row .amt{font-weight:600;white-space:nowrap}
.add{background:none;border:1px dashed var(--line);border-radius:10px;padding:10px;color:var(--muted);font-size:.9rem}
.editor{border-top:1px solid var(--line);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg)}
.editor label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.editor .full{grid-column:1/-1}
.editor .eacts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.editor .danger{color:var(--warn);margin-right:auto}
.months{display:flex;flex-direction:column;gap:10px}
.month{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chip{font-size:.75rem;border-radius:999px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.chip.over{color:var(--warn)} .chip.ok{color:var(--free)} .chip.part{color:var(--muted)}
.mbar{position:relative;height:10px;background:var(--track);border-radius:5px}
.mbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--free)}
.mbar .fill.over{background:var(--warn)}
.mbar .cap{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.55}
.mline{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
details{font-size:.85rem}
details summary{cursor:pointer;color:var(--muted);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"＋ "}
details[open] summary::before{content:"－ "}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:8px}
.kv .h{grid-column:1/-1;color:var(--muted);font-size:.78rem;margin-top:6px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;max-width:calc(100% - 32px);z-index:5}
.sheet{display:flex;flex-direction:column;gap:10px}
textarea{min-height:110px;font-size:13px;font-family:ui-monospace,monospace}
.notice{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;font-size:.9rem}
.notice span{color:var(--muted);font-size:.82rem}
/* 기록(월간·연간) */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager b{font-size:1.05rem}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:36px;font-size:1.1rem}
.pager button:disabled{opacity:.3}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .t{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .t .dot{width:8px;height:8px;border-radius:50%}
.tile .v{font-size:1.1rem;font-weight:700;overflow-wrap:anywhere}
.tile .v.neg{color:var(--warn)}
.yrow{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.yrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ybar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--track)}
.ybar span{display:block;height:100%}
.ytxt{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ── 저장 위치(같은 출처의 주식 앱과 겹치지 않게 ledger- 접두) ──
var LOCK_LS = "ledger-lock", STORE_LS = "ledger-store", FAIL_LS = "ledger-fail", PEND_SS = "ledger-pend";
var PBKDF2_ITER = 310000, IDLE_MS = 5 * 60 * 1000;
var ENV = null;        // book.json (암호문)
var KEY = null;        // 풀린 데이터 열쇠(base64url) — 메모리에만
var BASE = null;       // 풀린 book.json 내용
var STORE = null;      // 폰에서 입력한 것 {edits:{id:{...}|{deleted:true}}, confirms:{ "YYYY-MM": {at, rows:{id:{amount,none}}} }}
var idleT = null, editing = null;

var GROUPS = {income:{title:"고정 수입", color:"var(--income)"}, fixed:{title:"고정 지출", color:"var(--fixed)"}, invest:{title:"고정 재테크", color:"var(--invest)"}};
var FP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 11v3a6 6 0 0 1-1.2 3.6"/><path d="M8.5 9.5A4 4 0 0 1 16 11v2.5"/><path d="M6 12a6 6 0 0 1 11.5-2.4"/><path d="M4.5 8A8.5 8.5 0 0 1 19 7"/><path d="M15.5 16.5c-.3 1.2-.8 2.3-1.5 3.3"/><path d="M8 14.5c0 1.6-.4 3-1.2 4.2"/></svg>';

// ── 도구 ──
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function won(n){ return Math.round(n).toLocaleString("ko-KR") + "원"; }
function man(n){ return (Math.round(n / 1000) / 10).toLocaleString("ko-KR") + "만"; }
function toast(t){ var e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function(){ e.hidden = true; }, 2800); }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { if(v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
function b64u(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "="; return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
function e64(u8){ var s = ""; for(var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
function rnd(n){ return crypto.getRandomValues(new Uint8Array(n)); }
function ym(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function prevYm(s){ var p = s.split("-").map(Number); return ym(new Date(p[0], p[1] - 2, 1)); }
function nextYm(s){ var p = s.split("-").map(Number); return ym(new Date(p[0], p[1], 1)); }
function ymLabel(s){ var p = s.split("-"); return p[0] + "년 " + Number(p[1]) + "월"; }
function lockRec(){ try { return JSON.parse(lsGet(LOCK_LS) || "null"); } catch(e){ return null; } }

// ── 암호 ──
function aesKey(raw, use){ return crypto.subtle.importKey("raw", raw, "AES-GCM", false, use); }
function openEnv(env, k){
  return aesKey(b64u(k), ["decrypt"]).then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64u(env.iv)}, key, b64u(env.ct)); })
    .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}
function sealWith(k, obj){
  var iv = rnd(12);
  return aesKey(b64u(k), ["encrypt"]).then(function(key){ return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, key, new TextEncoder().encode(JSON.stringify(obj))); })
    .then(function(ct){ return {v:1, alg:"AES-GCM", iv:e64(iv), ct:e64(new Uint8Array(ct)), kid:ENV && ENV.kid}; });
}
function pinKey(pin, salt, iter){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]); });
}
function prfKey(secret){
  return crypto.subtle.importKey("raw", secret, "HKDF", false, ["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:new Uint8Array(0), info:new TextEncoder().encode("ledger-app key v1")},
      k, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]); });
}
function wrapK(wk, s){ var iv = rnd(12);
  return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, wk, new TextEncoder().encode(s)).then(function(ct){ return {iv:e64(iv), ct:e64(new Uint8Array(ct))}; }); }
function unwrapK(wk, w){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64u(w.iv)}, wk, b64u(w.ct)).then(function(b){ return new TextDecoder().decode(b); }); }

// 지문 — WebAuthn PRF 로 기기 생체 인증이 내주는 비밀값에서 열쇠 감싸개를 만든다.
// 통과 여부만 보는 문이 아니라 실제로 열쇠를 푸는 쪽이다. PRF 를 못 주면 지문은 켜지 않는다.
function bioGet(credId, salt){
  return navigator.credentials.get({publicKey:{challenge:rnd(32), allowCredentials:[{type:"public-key", id:credId}],
    userVerification:"required", timeout:60000, extensions:{prf:{eval:{first:salt}}}}}).then(function(a){
    var r = a.getClientExtensionResults ? a.getClientExtensionResults() : {};
    if(!r.prf || !r.prf.results || !r.prf.results.first) throw new Error("noprf");
    return r.prf.results.first;
  });
}
function bioRegister(){
  var salt = rnd(32);
  return navigator.credentials.create({publicKey:{
    rp:{name:"여유자금 가계부"}, user:{id:rnd(16), name:"ledger", displayName:"가계부"},
    challenge:rnd(32), pubKeyCredParams:[{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred"},
    timeout:60000, extensions:{prf:{eval:{first:salt}}}}}).then(function(cred){
    var ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
    if(!ext.prf || ext.prf.enabled === false) throw new Error("noprf");
    var id = new Uint8Array(cred.rawId), first = ext.prf.results && ext.prf.results.first;
    return (first ? Promise.resolve(first) : bioGet(id, salt)).then(prfKey).then(function(wk){ return wrapK(wk, KEY); }).then(function(w){
      var rec = lockRec(); rec.bio = {id:e64(id), salt:e64(salt), w:w}; lsSet(LOCK_LS, JSON.stringify(rec)); });
  });
}
// 비밀번호 틀림 — 5번부터 30초·60초·120초… 기다리게 한다
function failState(){ try { return JSON.parse(lsGet(FAIL_LS) || '{"n":0,"until":0}'); } catch(e){ return {n:0, until:0}; } }
function failBump(){ var f = failState(); f.n++; if(f.n >= 5) f.until = Date.now() + 30000 * Math.pow(2, Math.min(f.n - 5, 6)); lsSet(FAIL_LS, JSON.stringify(f)); return f; }

// ── 잠금 ──
function lockNow(){ KEY = null; BASE = null; STORE = null; editing = null; clearTimeout(idleT); route(); }
function touchIdle(){ if(!KEY) return; clearTimeout(idleT); idleT = setTimeout(lockNow, IDLE_MS); }
document.addEventListener("visibilitychange", function(){ if(document.hidden && KEY) lockNow(); });
["click", "touchstart", "keydown", "scroll"].forEach(function(ev){ document.addEventListener(ev, touchIdle, {passive:true}); });

(function takeKey(){
  var m = /[#&]k=([A-Za-z0-9_-]{40,})/.exec(location.hash || "");
  if(!m) return;
  try { sessionStorage.setItem(PEND_SS, m[1]); } catch(e){}
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
})();
function pendKey(){ try { return sessionStorage.getItem(PEND_SS); } catch(e){ return null; } }

function gate(title, sub){
  var g = el("section", "gate");
  var mk = el("div", "mark"); mk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M16 14.5h2"/><path d="M7 6V4.8A1.8 1.8 0 0 1 8.8 3h6.4A1.8 1.8 0 0 1 17 4.8V6"/></svg>';
  g.append(mk, el("h1", null, title));
  if(sub) g.append(el("p", "sub", sub));
  return g;
}
function pinInput(id, ph){ var i = el("input"); i.id = id; i.type = "password"; i.inputMode = "numeric"; i.pattern = "[0-9]*"; i.autocomplete = "off"; i.placeholder = ph; return i; }
function mount(node){ var a = $("app"); a.replaceChildren(node); window.scrollTo(0, 0); }

function viewKey(){
  var g = gate("여유자금 가계부", "처음 한 번만 열쇠를 넣습니다. 열쇠는 Claude 대화에서 받은 43자 문자열입니다.");
  var f = el("form"); var i = el("input"); i.id = "keyIn"; i.type = "password"; i.autocomplete = "off"; i.autocapitalize = "off"; i.spellcheck = false; i.placeholder = "열쇠(또는 #k= 붙은 주소) 붙여넣기";
  var b = el("button", "btn primary", "다음"); var err = el("div", "err");
  f.append(i, b, err); g.append(f);
  f.onsubmit = function(e){ e.preventDefault();
    var v = i.value.replace(/\s+/g, ""), m = /k=([A-Za-z0-9_-]+)/.exec(v); if(m) v = m[1];
    if(!/^[A-Za-z0-9_-]{40,}$/.test(v)){ err.textContent = "열쇠 모양이 아닙니다. 43자 한 줄을 그대로 붙여 주세요."; return; }
    openEnv(ENV, v).then(function(){ try { sessionStorage.setItem(PEND_SS, v); } catch(x){} route(); })
      .catch(function(){ err.textContent = "이 열쇠로는 열리지 않습니다. 한 글자라도 빠지지 않았는지 봐 주세요."; });
  };
  mount(g);
}
function viewSetPin(){
  var g = gate("비밀번호 정하기", "앱을 열 때 쓸 숫자 6자리 이상을 정해 주세요. 다음 화면에서 지문도 켤 수 있습니다.");
  var f = el("form"); var p1 = pinInput("pin1", "비밀번호(숫자 6자리 이상)"), p2 = pinInput("pin2", "한 번 더");
  var b = el("button", "btn primary", "잠금 만들기"), err = el("div", "err");
  f.append(p1, p2, b, err); g.append(f);
  f.onsubmit = function(e){ e.preventDefault();
    if(!/^[0-9]{6,}$/.test(p1.value)){ err.textContent = "숫자 6자리 이상으로 정해 주세요."; return; }
    if(p1.value !== p2.value){ err.textContent = "두 번 넣은 비밀번호가 다릅니다."; return; }
    var k = pendKey(); if(!k) return route();
    var salt = rnd(16); b.disabled = true;
    pinKey(p1.value, salt, PBKDF2_ITER).then(function(wk){ return wrapK(wk, k); }).then(function(w){
      lsSet(LOCK_LS, JSON.stringify({v:1, salt:e64(salt), iter:PBKDF2_ITER, w:w, kid:ENV.kid}));
      try { sessionStorage.removeItem(PEND_SS); } catch(x){}
      return unlocked(k, true);
    });
  };
  mount(g);
}
function viewBioOffer(){
  var g = gate("지문으로 열까요?", "켜 두면 다음부터 지문만으로 열립니다. 비밀번호는 지문이 안 될 때 씁니다.");
  var on = el("button", "btn primary bio"); on.innerHTML = FP + "<span>지문 켜기</span>";
  var skip = el("button", "btn link", "나중에"); var err = el("div", "err");
  on.onclick = function(){ on.disabled = true;
    bioRegister().then(function(){ toast("지문을 켰습니다"); afterUnlock(); })
      .catch(function(e){ on.disabled = false;

    h("들어온 돈"); add("월급·정기 입금", r.inc); if(r.other) add("상여·정산·기타", r.other);
    h("나간 돈"); add("고정 지출", r.fixed);
    Object.keys(m.cats || {}).sort(function(a, b){ return m.cats[b] - m.cats[a]; }).forEach(function(x){ add("여유 · " + x, m.cats[x]); });
    (m.oneoffs || []).forEach(function(o){ add("일회성 · " + o.date.replace("-", "/") + " " + o.to, o.amount); });
    h("저축·투자"); add("적금·청약 등", r.save); if(r.stock) add("증권 계좌로", r.stock);
  } else {
    ["income", "fixed", "invest"].forEach(function(g){ var rs = r.rows.filter(function(x){ return x.group === g; }); if(!rs.length) return;
      h(GROUPS[g].title); rs.forEach(function(x){ add(x.name, x.amount); }); });
  }
  box.append(kv); sec.append(box);
}
function yearView(sec, keys, years){
  var yi = years.indexOf(REC.y), y = REC.y, ks = keys.filter(function(k){ return k.slice(0, 4) === y; });
  sec.append(pager(y + "년", yi > 0 ? function(){ REC.y = years[yi - 1]; redrawRecords(); } : null,
    yi < years.length - 1 ? function(){ REC.y = years[yi + 1]; redrawRecords(); } : null));
  var rs = ks.map(recOf), T = {inT:0, outT:0, svT:0, left:0}, waiting = 0;
  rs.forEach(function(r){ var t = totals(r); Object.keys(T).forEach(function(x){ T[x] += t[x]; }); if(!r.bank) waiting++; });
  var first = Number(ks[0].slice(5)), last = Number(ks[ks.length - 1].slice(5));
  sec.append(el("div", "sub", "기록된 달 " + first + "월~" + last + "월(" + ks.length + "개월)" + (waiting ? " · " + waiting + "개월은 여유 지출 대기" : "")));
  var tl = el("div", "tiles");
  tl.append(tile("들어온 돈", won(T.inT), "var(--income)"), tile("나간 돈", won(T.outT), "var(--fixed)"),
    tile("저축·투자", won(T.svT), "var(--invest)"), tile("남은 돈", won(T.left), "var(--free)", T.left < 0));
  sec.append(tl);
  var full = rs.filter(function(r){ return r.bank && !r.partial; });
  if(full.length){ var a = {inT:0, outT:0, svT:0}; full.forEach(function(r){ var t = totals(r); a.inT += t.inT; a.outT += t.outT; a.svT += t.svT; });
    sec.append(el("div", "sub num", "다 끝난 " + full.length + "개월 월평균: 들어온 돈 " + man(a.inT / full.length) + " · 나간 돈 " + man(a.outT / full.length) + " · 저축·투자 " + man(a.svT / full.length))); }
  var maxIn = Math.max.apply(null, rs.map(function(r){ var t = totals(r); return Math.max(t.inT, t.outT + t.svT); })) || 1;
  rs.slice().reverse().forEach(function(r){
    var t = totals(r), b = el("button", "yrow"); b.type = "button";
    var top = el("div", "top"); top.append(el("b", null, Number(r.k.slice(5)) + "월"));
    top.append(el("span", "chip " + (r.partial || !r.bank ? "part" : t.left >= 0 ? "ok" : "over"), r.partial ? "진행 중" : !r.bank ? "대기" : (t.left >= 0 ? "남음 " : "모자람 ") + man(Math.abs(t.left))));
    var yb = el("div", "ybar"); yb.setAttribute("role", "img"); yb.setAttribute("aria-label", "나간 돈 " + won(t.outT) + ", 저축·투자 " + won(t.svT) + ", 남은 돈 " + won(t.left));
    [[t.outT, "var(--fixed)"], [t.svT, "var(--invest)"], [Math.max(t.left, 0), "var(--free)"]].forEach(function(p){ var s = el("span"); s.style.width = (p[0] / maxIn * 100) + "%"; s.style.background = p[1]; yb.append(s); });
    var tx = el("div", "ytxt num"); [["들어옴", t.inT], ["나감", t.outT], ["저축·투자", t.svT]].forEach(function(p){ tx.append(el("span", null, p[0] + " " + man(p[1]))); });
    b.append(top, yb, tx);
    b.onclick = function(){ REC.tab = "month"; REC.m = r.k; redrawRecords(); var e = $("records"); if(e) e.scrollIntoView({block:"start"}); };
    sec.append(b);
  });
}
function bar(v, cap, maxV, over){
  var b = el("div", "mbar"); b.setAttribute("role", "img"); b.setAttribute("aria-label", "여유 지출 " + won(v) + ", 여유 자금 " + won(cap));
  var f = el("div", "fill" + (over ? " over" : "")); f.style.width = Math.min(100, v / maxV * 100) + "%";
  var c = el("div", "cap"); c.style.left = Math.min(100, cap / maxV * 100) + "%"; b.append(f, c); return b;
}
function mline(m){ var l = el("div", "mline num"); l.append(el("span", null, "여유 지출 " + won(m.spend || 0))); if(m.oneoff) l.append(el("span", null, "큰 일회성 " + won(m.oneoff))); return l; }

// ── 시작 ──
route();
fetch("book.json", {cache:"no-cache"}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(j){ if(!j || j.alg !== "AES-GCM") throw 0; ENV = j; route(); })
  .catch(function(){ mount(gate("데이터를 받지 못했습니다", "인터넷 연결을 확인하고 다시 열어 주세요.")); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
